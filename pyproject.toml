[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-projection-model"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "duckdb>=0.3.0",
    "pydantic>=2.10.0",
    "httpx>=0.30.0",
    "nba_api>=1.1.10",
    "pbpstats>=0.1.0",
    "pyarrow>=12.0.0",
    "polars>=0.19.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

